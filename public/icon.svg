<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" />
  
  <!-- Outer Craft Hexagon / Isometric 3D Cube -->
  <g transform="translate(256, 256)">
    <!-- Top Face -->
    <path d="M 0,-140 L 120,-70 L 0,0 L -120,-70 Z" fill="url(#tealGrad)" opacity="0.95" />
    <!-- Left Face -->
    <path d="M -120,-70 L 0,0 L 0,140 L -120,70 Z" fill="#0f766e" />
    <!-- Right Face -->
    <path d="M 0,0 L 120,-70 L 120,70 L 0,140 Z" fill="#115e59" />

    <!-- Laser / Toolhead Beam -->
    <path d="M 0,-180 L 0,-15" stroke="url(#amberGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 8" />
    <polygon points="0,-10 -18,-50 18,-50" fill="#f59e0b" />
    <circle cx="0" cy="0" r="14" fill="#fbbf24" filter="drop-shadow(0 0 10px #f59e0b)" />

    <!-- Digital grid lines -->
    <line x1="-60" y1="-35" x2="60" y2="-105" stroke="#5eead4" stroke-width="2" stroke-opacity="0.6" />
    <line x1="-60" y1="35" x2="0" y2="70" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.4" />
    <line x1="60" y1="35" x2="0" y2="70" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.4" />
  </g>
</svg>
